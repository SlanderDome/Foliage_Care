      <div class="tabs">
        <button class="tab-button active" data-target="#login">Login</button>

      <form id="login" class="form active">
        <input type="email" placeholder="Email" required>
        <input type="password" placeholder="Password" required>
        <button type="submit" class="cta-button">Login</button>
      </form>

      
      <form id="signup" class="form">
        <input type="text" placeholder="Full Name" required>
        <input type="email" placeholder="Email" required>
        <input type="password" placeholder="Password" required>
        <button type="submit" class="cta-button">Signup</button>
      </form>

  </div>

          createUserWithEmailAndPassword,

      // ⬆️⬆️⬆️ END OF CONFIG ⬆️⬆️⬆️

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);

      // Make 'auth' and functions available to your login.js script
      window.firebaseAuth = auth;
      window.createUserWithEmailAndPassword = createUserWithEmailAndPassword;
      window.signInWithEmailAndPassword = signInWithEmailAndPassword;
      window.onAuthStateChanged = onAuthStateChanged;
      window.signInAnonymously = signInAnonymously;
      window.signInWithCustomToken = signInWithCustomToken;
      window.__initial_auth_token = undefined;

      // --- NEW FUNCTIONS FOR GOOGLE ---
      window.GoogleAuthProvider = GoogleAuthProvider;
      window.signInWithPopup = signInWithPopup;
